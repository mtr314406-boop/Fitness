<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fitness Coach</title>
<style>
  :root {
    --bg: #0e1116; --card: #171c24; --line: #2a3242; --text: #e8ecf2;
    --dim: #8b95a7; --accent: #4f8ef7;
    --green: #2ecc71; --yellow: #f1c40f; --red: #e74c3c; --unknown: #7f8c9b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6f9; --card:#ffffff; --line:#dde3ec; --text:#16202e; --dim:#5c6879; }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 20px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .gate { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; color: #08101d; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; color: var(--dim); font-size: 15px; }
  .stats b { color: var(--text); font-size: 17px; }
  .call { white-space: normal; }
  .call p { margin: 0 0 10px; }
  .call li { margin-left: 20px; }
  button, .tab {
    font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .btn {
    background: var(--accent); color: #fff; border-radius: 10px;
    padding: 10px 16px; font-weight: 600;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; align-items: center; }
  textarea {
    flex: 1; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: none;
  }
  .msg { padding: 10px 14px; border-radius: 14px; margin-bottom: 8px; max-width: 88%; }
  .msg.user { background: var(--accent); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.assistant { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg .kind { font-size: 12px; color: var(--dim); margin-bottom: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { padding: 6px 8px; text-align: left; border-top: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; border-top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--dim); font-size: 14px; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; padding: 12px 0 10px; background: none; color: var(--dim);
    font-size: 13px; font-weight: 600; text-align: center;
  }
  .tab .ic { display: block; font-size: 22px; line-height: 1.2; }
  .tab.active { color: var(--accent); }
  .spin { color: var(--dim); padding: 24px; text-align: center; }
  .err { color: var(--red); }
</style>
</head>
<body>
<main id="view"><div class="spin">Loading…</div></main>
<nav>
  <button class="tab" data-t="today"><span class="ic">☀️</span>Today</button>
  <button class="tab" data-t="chat"><span class="ic">💬</span>Chat</button>
  <button class="tab" data-t="plan"><span class="ic">🗺️</span>Plan</button>
</nav>
<script>
const view = document.getElementById('view');
const tabs = document.querySelectorAll('.tab');
let current = location.hash.slice(1) || 'today';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Tiny markdown: bold, bullets, paragraphs. Escaped first, so safe.
function md(s) {
  const html = esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return html.split(/\n\n+/).map(p =>
    /^(\d+\.|[-*]) /m.test(p)
      ? '<ul>' + p.split('\n').map(l => '<li>' + l.replace(/^(\d+\.|[-*]) /, '') + '</li>').join('') + '</ul>'
      : '<p>' + p.replace(/\n/g, '<br>') + '</p>'
  ).join('');
}
const day = (d) => d ? String(d).slice(0, 10) : '—';
async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const GATE_COLORS = { GREEN: 'var(--green)', YELLOW: 'var(--yellow)', RED: 'var(--red)' };

// --- Today ---
async function renderToday(refresh = false) {
  view.innerHTML = '<div class="spin">' + (refresh ? 'Asking the coach…' : 'Loading…') + '</div>';
  try {
    const t = await api('/today' + (refresh ? '?refresh=1' : ''));
    const gateWord = (t.gate || 'UNKNOWN').split(' ')[0];
    const w = t.whoop || {};
    view.innerHTML = `
      <h1>Today</h1>
      <div class="card">
        <span class="gate" style="background:${GATE_COLORS[gateWord] || 'var(--unknown)'}">${esc(gateWord)}</span>
        <div class="stats">
          <span>Recovery <b>${w.recovery_pct ?? '—'}%</b></span>
          <span>Sleep <b>${w.sleep_hours ?? '—'}h</b></span>
          <span>HRV <b>${w.hrv_ms ? Math.round(w.hrv_ms) : '—'}</b></span>
          <span>RHR <b>${w.resting_hr ?? '—'}</b></span>
        </div>
        <div class="muted" style="margin-top:6px">WHOOP day ${day(w.day)} · ${esc(t.plan?.phase ?? '')} week ${t.plan?.week_in_phase ?? '—'}</div>
      </div>
      <h2>The call</h2>
      <div class="card call">${md(t.call)}</div>
      <div class="row">
        <button class="btn ghost" id="refresh">↻ New check-in</button>
        <button class="btn ghost" id="sync">⇅ Sync WHOOP</button>
      </div>
      <h2 style="margin-top:24px">Reply</h2>
      <div class="row"><textarea id="box" rows="2" placeholder="Talk to the coach…"></textarea><button class="btn" id="send">Send</button></div>
      <div id="reply"></div>`;
    document.getElementById('refresh').onclick = () => renderToday(true);
    document.getElementById('sync').onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = 'Syncing…';
      try { await api('/sync/whoop', { method: 'POST' }); renderToday(); }
      catch (err) { e.target.textContent = 'Sync failed'; console.error(err); }
    };
    wireChatBox('reply');
  } catch (e) {
    view.innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
  }
}

function wireChatBox(replyElId) {
  const box = document.getElementById('box'), send = document.getElementById('send');
  send.onclick = async () => {
    const message = box.value.trim();
    if (!message) return;
    send.disabled = true; send.textContent = '…';
    try {
      const r = await api('/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message }),
      });
      box.value = '';
      const el = document.getElementById(replyElId);
      if (el) el.innerHTML = '<div class="card call" style="margin-top:12px">' + md(r.reply) + '</div>';
      else renderChat();
    } catch (e) { alert(e.message); }
    send.disabled = false; send.textContent = 'Send';
  };
}

// --- Chat ---
async function renderChat() {
  view.innerHTML = '<div class="spin">Loading…</div>';
  try {
    const { messages } = await api('/chat');
    view.innerHTML = `
      <h1>Chat</h1>
      <div id="log">${messages.map(m => `
        <div class="msg ${esc(m.role)}">
          ${m.kind === 'checkin' ? '<div class="kind">morning check-in · ' + day(m.created_at) + '</div>' : ''}
          ${md(m.content)}
        </div>`).join('') || '<p class="muted">No conversation yet. Say something.</p>'}
      </div>
      <div class="row" style="margin-top:14px"><textarea id="box" rows="2" placeholder="Talk to the coach…"></textarea><button class="btn" id="send">Send</button></div>`;
    wireChatBox(null);
    window.scrollTo(0, document.body.scrollHeight);
  } catch (e) {
    view.innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
  }
}

// --- Plan ---
async function renderPlan() {
  view.innerHTML = '<div class="spin">Loading…</div>';
  try {
    const p = await api('/plan');
    view.innerHTML = `
      <h1>Plan</h1>
      <div class="card">
        <b>${esc(p.state?.phase)}</b> · week ${p.state?.week_in_phase} · event ${day(p.state?.event_date)}
        ${p.aet ? `<div class="muted">AeT ceiling ${p.aet.aet_hr} bpm (tested ${day(p.aet.set_on)})</div>`
                : '<div class="muted">No drift test yet — Z2 by nasal breathing</div>'}
      </div>
      <h2>Season arc</h2>
      <div class="card">${p.arc.map(a => `<p><b>${esc(a.phase)}</b> <span class="muted">${esc(a.window)}</span><br>${esc(a.focus)}</p>`).join('')}</div>
      <h2>The week</h2>
      <div class="card">${p.week.map(d => '<p>' + esc(d) + '</p>').join('')}</div>
      ${p.tomorrow ? `<h2>Tomorrow: ${esc(p.tomorrow.slot)}</h2>
      <div class="card">${p.tomorrow.lines.map(l => '<p>' + esc(l) + '</p>').join('')}</div>
      <button class="btn" id="pushHevy">→ Send tomorrow to Hevy</button>
      <div id="pushResult"></div>` : ''}
      <h2>Working weights</h2>
      <div class="card" style="padding:8px 12px">
        <table>
          <tr><th>Exercise</th><th class="num">lb</th><th></th></tr>
          ${p.weights.map(w => `<tr>
            <td>${esc(w.exercise)}${w.is_protected ? ' ★' : ''}</td>
            <td class="num">${w.weight_lbs ?? '<span class="muted">cal.</span>'}</td>
            <td class="muted">${w.hard_cap_lbs ? 'cap ' + w.hard_cap_lbs : ''}</td>
          </tr>`).join('')}
        </table>
      </div>`;
    const pb = document.getElementById('pushHevy');
    if (pb) pb.onclick = async () => {
      pb.disabled = true; pb.textContent = 'Sending…';
      try {
        const r = await api('/hevy/routine', { method: 'POST' });
        document.getElementById('pushResult').innerHTML = '<div class="card" style="margin-top:12px">' +
          (r.skipped ? esc(r.skipped)
                     : '✅ <b>' + esc(r.created) + '</b> is in Hevy (Coach folder)' +
                       (r.unmatched?.length ? '<br>⚠️ No Hevy match for: ' + esc(r.unmatched.join(', ')) : '')) +
          '</div>';
        pb.textContent = r.skipped ? '→ Send tomorrow to Hevy' : 'Sent ✓';
        if (r.skipped) pb.disabled = false;
      } catch (e) {
        document.getElementById('pushResult').innerHTML = '<div class="card err" style="margin-top:12px">' + esc(e.message) + '</div>';
        pb.disabled = false; pb.textContent = '→ Send tomorrow to Hevy';
      }
    };
  } catch (e) {
    view.innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
  }
}

const RENDER = { today: () => renderToday(), chat: renderChat, plan: renderPlan };
function go(t) {
  current = t; location.hash = t;
  tabs.forEach(b => b.classList.toggle('active', b.dataset.t === t));
  RENDER[t]();
}
tabs.forEach(b => (b.onclick = () => go(b.dataset.t)));
go(RENDER[current] ? current : 'today');
</script>
</body>
</html>
