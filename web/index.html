<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fitness Coach</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0d0d; --card: #1a1a19; --line: #2c2c2a; --text: #ffffff;
    --dim: #c3c2b7; --muted: #898781; --accent: #3987e5;
    /* status palette — fixed, never themed */
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --unknown: #898781;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg:#f9f9f7; --card:#fcfcfb; --line:#e1e0d9; --text:#0b0b0b;
      --dim:#52514e; --muted:#898781; --accent:#2a78d6;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 20px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .gate { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; letter-spacing: .02em; }
  .gate .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; color: var(--dim); font-size: 15px; }
  .stats b { color: var(--text); font-size: 17px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
  .chip { font-size: 13px; font-weight: 600; color: var(--dim); border: 1px solid var(--line);
          border-radius: 999px; padding: 3px 10px; background: var(--card); }
  .hero-wrap { display: flex; align-items: center; gap: 18px; }
  .hero-num { font-size: 48px; font-weight: 700; line-height: 1; }
  .hero-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .gate-hint { color: var(--dim); font-size: 14px; margin-top: 6px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; }
  .tile b { display: block; font-size: 20px; font-weight: 650; }
  .tile span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 2px; }
  .weekstrip { display: flex; gap: 2px; align-items: flex-end; height: 44px; margin-top: 14px; }
  .weekstrip .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
  .weekstrip .bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; }
  .weekstrip .lbl { font-size: 10px; color: var(--muted); }
  .exrow { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px solid var(--line); }
  .exrow:first-of-type { border-top: 0; }
  .exrow .sets { color: var(--dim); text-align: right; }
  .action {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px; color: var(--text); text-align: left;
  }
  .action:disabled { opacity: .55; }
  .action .n {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .action .t { font-weight: 600; }
  .action .s { display: block; font-size: 13px; color: var(--muted); }
  .action .state { margin-left: auto; font-size: 15px; color: var(--muted); flex: none; }
  .call { white-space: normal; }
  .call p { margin: 0 0 10px; }
  .call li { margin-left: 20px; }
  button, .tab {
    font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .btn {
    background: var(--accent); color: #fff; border-radius: 10px;
    padding: 10px 16px; font-weight: 600;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; align-items: center; }
  textarea {
    flex: 1; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: none;
  }
  .msg { padding: 10px 14px; border-radius: 14px; margin-bottom: 8px; max-width: 88%; }
  .msg.user { background: var(--accent); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.assistant { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg .kind { font-size: 12px; color: var(--dim); margin-bottom: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { padding: 6px 8px; text-align: left; border-top: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; border-top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--dim); font-size: 14px; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; padding: 12px 0 10px; background: none; color: var(--dim);
    font-size: 13px; font-weight: 600; text-align: center;
  }
  .tab .ic { display: block; font-size: 22px; line-height: 1.2; }
  .tab.active { color: var(--accent); }
  .spin { color: var(--dim); padding: 24px; text-align: center; }
  .err { color: var(--red); }
</style>
</head>
<body>
<main id="view"><div class="spin">Loading…</div></main>
<nav>
  <button class="tab" data-t="today"><span class="ic">☀️</span>Today</button>
  <button class="tab" data-t="chat"><span class="ic">💬</span>Chat</button>
  <button class="tab" data-t="plan"><span class="ic">🗺️</span>Plan</button>
</nav>
<script>
const view = document.getElementById('view');
const tabs = document.querySelectorAll('.tab');
let current = location.hash.slice(1) || 'today';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Tiny markdown: bold, bullets, paragraphs. Escaped first, so safe.
function md(s) {
  const html = esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return html.split(/\n\n+/).map(p =>
    /^(\d+\.|[-*]) /m.test(p)
      ? '<ul>' + p.split('\n').map(l => '<li>' + l.replace(/^(\d+\.|[-*]) /, '') + '</li>').join('') + '</ul>'
      : '<p>' + p.replace(/\n/g, '<br>') + '</p>'
  ).join('');
}
const day = (d) => d ? String(d).slice(0, 10) : '—';
async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const GATE = {
  GREEN:   { color: 'var(--good)',     hint: 'Push — progressions apply' },
  YELLOW:  { color: 'var(--warning)',  hint: 'Hold — session as programmed, no forced progressions' },
  RED:     { color: 'var(--critical)', hint: 'Modify — volume down, RPE capped' },
  UNKNOWN: { color: 'var(--unknown)',  hint: 'No recovery synced yet' },
};
function ring(pct, color) {
  const r = 50, c = 2 * Math.PI * r;
  const filled = pct != null ? (Math.min(pct, 100) / 100) * c : 0;
  return `<svg width="118" height="118" viewBox="0 0 118 118" role="img" aria-label="Recovery ${pct ?? 'unknown'}%">
    <circle cx="59" cy="59" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="59" cy="59" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${filled} ${c}"
      transform="rotate(-90 59 59)"/>
    <text x="59" y="66" text-anchor="middle" font-size="30" font-weight="700" fill="var(--text)">${pct ?? '—'}</text>
  </svg>`;
}

// --- Today ---
async function renderToday(refresh = false) {
  view.innerHTML = '<div class="spin">' + (refresh ? 'Asking the coach…' : 'Loading…') + '</div>';
  try {
    const t = await api('/today' + (refresh ? '?refresh=1' : ''));
    const gateWord = (t.gate || 'UNKNOWN').split(' ')[0];
    const g = GATE[gateWord] || GATE.UNKNOWN;
    const w = t.whoop || {};
    const now = new Date();
    const week = t.week || [];
    const maxRec = 100;
    view.innerHTML = `
      <h1>${now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</h1>
      <div class="chips">
        <span class="chip">${esc(t.plan?.phase ?? '')} · week ${t.plan?.week_in_phase ?? '—'}</span>
        ${t.weeksToEvent != null ? `<span class="chip">🏔️ ${t.weeksToEvent} wks to the hunt</span>` : ''}
        ${t.slot ? `<span class="chip">${esc(t.slot.split('(')[0].trim())}</span>` : ''}
      </div>
      <div class="card">
        <div class="hero-wrap">
          ${ring(w.recovery_pct ?? null, g.color)}
          <div>
            <span class="gate"><span class="dot" style="background:${g.color}"></span>${esc(gateWord)}</span>
            <div class="gate-hint">${esc(g.hint)}</div>
            <div class="hero-sub">WHOOP recovery · ${day(w.day)}</div>
          </div>
        </div>
        <div class="tiles">
          <div class="tile"><b>${w.sleep_hours ?? '—'}</b><span>sleep h</span></div>
          <div class="tile"><b>${w.hrv_ms ? Math.round(w.hrv_ms) : '—'}</b><span>hrv ms</span></div>
          <div class="tile"><b>${w.resting_hr ?? '—'}</b><span>rhr bpm</span></div>
          <div class="tile"><b>${w.strain ?? '—'}</b><span>strain</span></div>
        </div>
        ${week.length > 1 ? `<div class="weekstrip">${week.map(d => {
          const pct = d.recovery_pct;
          const wd = 'SMTWTFS'[new Date(d.day).getUTCDay()];
          const col = pct == null ? 'var(--line)' : pct >= 67 ? 'var(--good)' : pct >= 34 ? 'var(--warning)' : 'var(--critical)';
          return `<div class="col" title="${day(d.day)}: ${pct ?? '?'}%">
            <div class="bar" style="height:${pct ? Math.max(6, (pct / maxRec) * 100) : 4}%;background:${col};opacity:.85"></div>
            <div class="lbl">${wd}</div>
          </div>`;
        }).join('')}</div>` : ''}
      </div>
      <h2>The call</h2>
      <div class="card call">${md(t.call)}</div>
      <h2>Daily flow</h2>
      <button class="action" id="sync">
        <span class="n">1</span>
        <span><span class="t">Sync WHOOP</span><span class="s">Morning — pull overnight recovery</span></span>
        <span class="state">⇅</span>
      </button>
      <button class="action" id="refresh">
        <span class="n">2</span>
        <span><span class="t">Fresh check-in</span><span class="s">Coach re-reads recovery, gives today's call</span></span>
        <span class="state">↻</span>
      </button>
      <button class="action" id="pushToday">
        <span class="n">3</span>
        <span><span class="t">Send today to Hevy</span><span class="s">Session lands in your gym app</span></span>
        <span class="state">✎</span>
      </button>
      <button class="action" id="syncHevy">
        <span class="n">4</span>
        <span><span class="t">Sync workout</span><span class="s">After lifting — pull results, check progressions</span></span>
        <span class="state">🏋️</span>
      </button>
      <div id="syncResult"></div>
      ${(t.workouts?.length || t.cardio?.length) ? `
      <h2>Today's training</h2>
      ${(t.workouts || []).map(w => `
        <div class="card">
          <b>${esc(w.title ?? w.slot ?? 'Workout')}</b>
          <div class="muted">${w.total_sets} sets · ${Math.round(w.total_volume ?? 0).toLocaleString()} lb volume</div>
          ${w.whoop ? `<div class="tiles" style="grid-template-columns:repeat(${w.whoop.kilojoules ? 4 : 3},1fr);margin:10px 0">
            <div class="tile"><b>${w.whoop.strain ?? '—'}</b><span>strain</span></div>
            <div class="tile"><b>${w.whoop.avg_hr ?? '—'}</b><span>avg hr</span></div>
            <div class="tile"><b>${w.whoop.max_hr ?? '—'}</b><span>max hr</span></div>
            ${w.whoop.kilojoules ? `<div class="tile"><b>${Math.round(w.whoop.kilojoules / 4.184)}</b><span>cal</span></div>` : ''}
          </div>` : '<div class="muted" style="margin:6px 0">No WHOOP activity matched — start Strength Trainer next lift.</div>'}
          <div style="margin-top:8px">
          ${w.exercises.map(e => `<div class="exrow"><span>${esc(e.name)}</span><span class="sets">${esc(e.sets)}</span></div>`).join('')}
          </div>
        </div>`).join('')}
      ${(t.cardio || []).map(c => `
        <div class="card">
          <b>${esc(c.modality ?? 'Cardio')}${c.is_drift_test ? ' — DRIFT TEST' : ''}</b>
          <div class="stats" style="margin-top:6px">
            <span>Duration <b>${c.duration_min ?? '—'} min</b></span>
            <span>Avg HR <b>${c.avg_hr ?? '—'}</b></span>
            ${c.incline_pct != null ? `<span>Incline <b>${c.incline_pct}%</b></span>` : ''}
            ${c.speed_mph != null ? `<span>Speed <b>${c.speed_mph} mph</b></span>` : ''}
          </div>
        </div>`).join('')}` : ''}
      <h2 style="margin-top:24px">Reply</h2>
      <div class="row"><textarea id="box" rows="2" placeholder="Talk to the coach…"></textarea><button class="btn" id="send">Send</button></div>
      <div id="reply"></div>`;
    // Action-list plumbing: number badge stays, right-side state animates.
    const action = (id, fn, doneState) => {
      const btn = document.getElementById(id);
      const st = btn.querySelector('.state');
      const idle = st.textContent;
      btn.onclick = async () => {
        btn.disabled = true; st.textContent = '…';
        try {
          await fn();
          st.textContent = doneState ?? idle;
          if (!doneState) btn.disabled = false;
        } catch (err) {
          document.getElementById('syncResult').innerHTML =
            '<div class="card err" style="margin-top:12px">' + esc(err.message) + '</div>';
          btn.disabled = false; st.textContent = idle;
        }
      };
    };
    action('sync', async () => {
      await api('/sync/whoop', { method: 'POST' });
      await renderToday();
    });
    action('refresh', () => renderToday(true));
    action('pushToday', async () => {
      const r = await api('/hevy/routine?day=today', { method: 'POST' });
      document.getElementById('syncResult').innerHTML = '<div class="card" style="margin-top:12px">' +
        (r.skipped ? esc(r.skipped)
                   : '✅ <b>' + esc(r.created) + '</b> is in Hevy — delete any older routine for today.' +
                     (r.unmatched?.length ? '<br>⚠️ No Hevy match for: ' + esc(r.unmatched.join(', ')) : '')) +
        '</div>';
    }, '✓');
    action('syncHevy', async () => {
      const s = await api('/sync/hevy', { method: 'POST' });
      const prog = await api('/progression/apply', { method: 'POST' });
      const moves = (prog.moved || []).map(m => `⬆️ ${m.exercise}: ${m.from} → ${m.to} lb`);
      await renderToday(); // re-render so Today's training section appears
      document.getElementById('syncResult').innerHTML = '<div class="card" style="margin-top:12px">' +
        `Pulled ${s.synced} workout(s) from Hevy.` +
        (moves.length ? '<br>' + moves.join('<br>') : '<br>No progression bumps yet — earned after 2 good exposures.') +
        '</div>';
    });
    wireChatBox('reply');
  } catch (e) {
    view.innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
  }
}

function wireChatBox(replyElId) {
  const box = document.getElementById('box'), send = document.getElementById('send');
  send.onclick = async () => {
    const message = box.value.trim();
    if (!message) return;
    send.disabled = true; send.textContent = '…';
    try {
      const r = await api('/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message }),
      });
      box.value = '';
      const el = document.getElementById(replyElId);
      if (el) el.innerHTML = '<div class="card call" style="margin-top:12px">' + md(r.reply) + '</div>';
      else renderChat();
    } catch (e) { alert(e.message); }
    send.disabled = false; send.textContent = 'Send';
  };
}

// --- Chat ---
async function renderChat() {
  view.innerHTML = '<div class="spin">Loading…</div>';
  try {
    const { messages } = await api('/chat');
    view.innerHTML = `
      <h1>Chat</h1>
      <div id="log">${messages.map(m => `
        <div class="msg ${esc(m.role)}">
          ${m.kind === 'checkin' ? '<div class="kind">morning check-in · ' + day(m.created_at) + '</div>' : ''}
          ${md(m.content)}
        </div>`).join('') || '<p class="muted">No conversation yet. Say something.</p>'}
      </div>
      <div class="row" style="margin-top:14px"><textarea id="box" rows="2" placeholder="Talk to the coach…"></textarea><button class="btn" id="send">Send</button></div>`;
    wireChatBox(null);
    window.scrollTo(0, document.body.scrollHeight);
  } catch (e) {
    view.innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
  }
}

// --- Plan ---
async function renderPlan() {
  view.innerHTML = '<div class="spin">Loading…</div>';
  try {
    const p = await api('/plan');
    view.innerHTML = `
      <h1>Plan</h1>
      <div class="card">
        <b>${esc(p.state?.phase)}</b> · week ${p.state?.week_in_phase} · event ${day(p.state?.event_date)}
        ${p.aet ? `<div class="muted">AeT ceiling ${p.aet.aet_hr} bpm (tested ${day(p.aet.set_on)})</div>`
                : '<div class="muted">No drift test yet — Z2 by nasal breathing</div>'}
      </div>
      <h2>Season arc</h2>
      <div class="card">${p.arc.map(a => `<p><b>${esc(a.phase)}</b> <span class="muted">${esc(a.window)}</span><br>${esc(a.focus)}</p>`).join('')}</div>
      <h2>The week</h2>
      <div class="card">${p.week.map(d => '<p>' + esc(d) + '</p>').join('')}</div>
      ${p.tomorrow ? `<h2>Tomorrow: ${esc(p.tomorrow.slot)}</h2>
      <div class="card">${p.tomorrow.lines.map(l => '<p>' + esc(l) + '</p>').join('')}
        <p class="muted" style="margin-top:8px">${p.tomorrow.source === 'coach'
          ? "The coach's plan — this is what went to Hevy."
          : "Default template — Send to Hevy gets the coach's real plan."}</p>
      </div>
      <button class="btn" id="pushHevy">→ Send tomorrow to Hevy</button>
      <div id="pushResult"></div>` : ''}
      <h2>Working weights</h2>
      <div class="card" style="padding:8px 12px">
        <table>
          <tr><th>Exercise</th><th class="num">lb</th><th></th></tr>
          ${p.weights.map(w => `<tr>
            <td>${esc(w.exercise)}${w.is_protected ? ' ★' : ''}</td>
            <td class="num">${w.weight_lbs ?? '<span class="muted">cal.</span>'}</td>
            <td class="muted">${w.hard_cap_lbs ? 'cap ' + w.hard_cap_lbs : ''}</td>
          </tr>`).join('')}
        </table>
      </div>`;
    const pb = document.getElementById('pushHevy');
    if (pb) pb.onclick = async () => {
      pb.disabled = true; pb.textContent = 'Sending…';
      try {
        const r = await api('/hevy/routine', { method: 'POST' });
        document.getElementById('pushResult').innerHTML = '<div class="card" style="margin-top:12px">' +
          (r.skipped ? esc(r.skipped)
                     : '✅ <b>' + esc(r.created) + '</b> is in Hevy (Coach folder)' +
                       (r.unmatched?.length ? '<br>⚠️ No Hevy match for: ' + esc(r.unmatched.join(', ')) : '')) +
          '</div>';
        pb.textContent = r.skipped ? '→ Send tomorrow to Hevy' : 'Sent ✓';
        if (r.skipped) pb.disabled = false;
      } catch (e) {
        document.getElementById('pushResult').innerHTML = '<div class="card err" style="margin-top:12px">' + esc(e.message) + '</div>';
        pb.disabled = false; pb.textContent = '→ Send tomorrow to Hevy';
      }
    };
  } catch (e) {
    view.innerHTML = '<div class="card err">' + esc(e.message) + '</div>';
  }
}

const RENDER = { today: () => renderToday(), chat: renderChat, plan: renderPlan };
function go(t) {
  current = t; location.hash = t;
  tabs.forEach(b => b.classList.toggle('active', b.dataset.t === t));
  RENDER[t]();
}
tabs.forEach(b => (b.onclick = () => go(b.dataset.t)));
go(RENDER[current] ? current : 'today');
</script>
</body>
</html>
